<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Rune's Scroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --ink: #f3e9d2;
        --ink-dim: #c9b98f;
        --gold: #d4af37;
        --gold-bright: #f0cf6b;
        --gold-deep: #8a6d1f;
        --card-bg: #0d0b06;
        --card-border: #6e5716;
        --wrong: #e5484d;
        --wrong-bg: #2a0d0e;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "EB Garamond", Georgia, "Times New Roman", serif;
        font-size: 19px;
        line-height: 1.45;
        -webkit-text-size-adjust: 100%;
      }
      .wrap {
        max-width: 600px;
        margin: 0 auto;
        padding: 18px 16px 28px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ---------- Header ---------- */
      header {
        text-align: center;
        padding: 6px 0 14px;
        position: relative;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .brand-logo {
        width: 84px;
        height: 84px;
        object-fit: contain;
        flex: 0 0 auto;
      }
      h1.title {
        font-family: "Cinzel", Georgia, serif;
        font-weight: 900;
        font-size: 30px;
        letter-spacing: 0.14em;
        margin: 0;
        color: var(--gold-bright);
      }

      /* ---------- Tabs ---------- */
      nav.tabs {
        display: flex;
        gap: 8px;
        margin: 16px 0 18px;
      }
      nav.tabs button {
        flex: 1 1 0;
        min-height: 58px;
        padding: 10px 6px;
        background: #0a0803;
        color: var(--ink-dim);
        border: 1.5px solid var(--gold-deep);
        border-radius: var(--radius);
        font-family: "Cinzel", Georgia, serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.04em;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      nav.tabs button[aria-selected="true"] {
        background: var(--gold);
        border-color: var(--gold-bright);
        color: #171106;
      }
      nav.tabs button:focus-visible {
        outline: 2px solid var(--gold-bright);
        outline-offset: 2px;
      }

      /* ---------- Feed ---------- */
      main { flex: 1 1 auto; }
      .feed {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .card {
        background: var(--card-bg);
        border: 1.5px solid var(--card-border);
        border-radius: var(--radius);
        padding: 16px 18px 18px;
        box-shadow: inset 0 0 0 1px #000, inset 0 0 22px rgba(212, 175, 55, 0.05);
        scroll-margin-top: 14px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .card:focus {
        outline: none;
        border-color: var(--gold-bright);
        background: #161106;
        box-shadow: inset 0 0 0 1px #000, inset 0 0 22px rgba(212, 175, 55, 0.12), 0 0 0 2px var(--gold-bright);
      }
      .card .date {
        font-family: "Cinzel", Georgia, serif;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: var(--gold);
        text-transform: uppercase;
        margin: 0 0 7px;
      }
      .card h2 {
        font-size: 21px;
        line-height: 1.3;
        font-weight: 700;
        margin: 0 0 8px;
        color: var(--ink);
      }
      .card p.sub {
        margin: 0;
        font-size: 17.5px;
        line-height: 1.5;
        color: var(--ink-dim);
      }
      .state-msg {
        text-align: center;
        color: var(--ink-dim);
        font-style: italic;
        font-size: 18px;
        padding: 42px 16px;
        border: 1.5px dashed var(--gold-deep);
        border-radius: var(--radius);
      }

      /* ---------- Quiz ---------- */
      .quiz-progress {
        font-family: "Cinzel", Georgia, serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        text-align: center;
        margin: 2px 0 14px;
      }
      .quiz-q {
        font-size: 22px;
        font-weight: 600;
        line-height: 1.4;
        margin: 0 0 18px;
        text-align: center;
      }
      .answers {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .answers button {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        text-align: left;
        min-height: 62px;
        padding: 14px 16px;
        background: var(--card-bg);
        color: var(--ink);
        border: 1.5px solid var(--card-border);
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 18.5px;
        line-height: 1.4;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .answers button .letter {
        flex: 0 0 auto;
        font-family: "Cinzel", Georgia, serif;
        font-weight: 900;
        color: var(--gold-bright);
        border: 1.5px solid var(--gold-deep);
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        margin-top: 1px;
      }
      .answers button.wrong {
        border-color: var(--wrong);
        background: var(--wrong-bg);
        color: #f3b6b8;
      }
      .answers button.wrong .letter {
        border-color: var(--wrong);
        color: var(--wrong);
      }
      .answers button:focus-visible,
      .big-btn:focus-visible {
        outline: 2px solid var(--gold-bright);
        outline-offset: 2px;
      }
      .correct-screen {
        text-align: center;
        padding: 10px 4px 4px;
      }
      .correct-screen .burst {
        font-size: 40px;
        color: var(--gold-bright);
        line-height: 1;
      }
      .correct-screen h2 {
        font-family: "Cinzel", Georgia, serif;
        font-weight: 900;
        letter-spacing: 0.1em;
        font-size: 30px;
        color: var(--gold-bright);
        margin: 8px 0 14px;
      }
      .correct-screen p.fact {
        font-size: 19px;
        line-height: 1.55;
        color: var(--ink);
        margin: 0 auto 24px;
        max-width: 46ch;
      }
      .big-btn {
        min-height: 58px;
        padding: 12px 34px;
        background: var(--gold);
        border: 1.5px solid var(--gold-bright);
        border-radius: var(--radius);
        color: #171106;
        font-family: "Cinzel", Georgia, serif;
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 0.05em;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .done-screen { text-align: center; padding: 16px 4px; }
      .done-screen h2 {
        font-family: "Cinzel", Georgia, serif;
        font-weight: 900;
        letter-spacing: 0.08em;
        font-size: 26px;
        color: var(--gold-bright);
        margin: 0 0 12px;
      }
      .done-screen p { color: var(--ink-dim); font-size: 18px; margin: 0 0 24px; }

      /* ---------- Footer ---------- */
      footer {
        margin-top: 26px;
        padding-top: 14px;
        border-top: 1px solid var(--gold-deep);
        text-align: center;
        color: var(--ink-dim);
        font-size: 15.5px;
      }
      footer .scribed {
        font-family: "Cinzel", Georgia, serif;
        letter-spacing: 0.12em;
        font-size: 13.5px;
        color: var(--gold);
        text-transform: uppercase;
      }
      footer .updated { font-style: italic; margin-top: 3px; }

      [hidden] { display: none !important; }

      @media (max-width: 430px) {
        .brand { gap: 12px; }
        .brand-logo { width: 64px; height: 64px; }
        h1.title { font-size: 24px; letter-spacing: 0.1em; }
      }
    </style>
  </head>

      <footer>
        <div class="scribed">Scribed by Rune</div>

      </footer>
    </div>

    <script>
      (function () {
        "use strict";

        /* ---------- Tabs ---------- */
        var TABS = ["meta", "industry", "quiz"];
        var updatedByTab = { meta: null, industry: null };
        var currentTab = "meta";

        function showTab(name) {
          currentTab = name;
          TABS.forEach(function (t) {
            var btn = document.getElementById("tab-" + t);
            var panel = document.getElementById("panel-" + t);
            var active = t === name;
            btn.setAttribute("aria-selected", active ? "true" : "false");
            panel.hidden = !active;
          });
          updateFooter(name);
          window.scrollTo(0, 0);
        }

        TABS.forEach(function (t) {
          document.getElementById("tab-" + t).addEventListener("click", function () {
            showTab(t);
          });
        });

        function updateFooter(activeTab) {
          var el = document.getElementById("footer-updated");
          var date = updatedByTab[activeTab] || updatedByTab.meta || updatedByTab.industry;
          el.textContent = date ? "Updated " + date : "Updated —";
        }

        /* ---------- News feeds ---------- */
        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        var reduceMotion = window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function focusCard(card) {
          card.focus({ preventScroll: true });
          card.scrollIntoView({
            behavior: reduceMotion ? "auto" : "smooth",
            block: "start"
          });
        }

        function renderFeed(feedEl, data) {
          feedEl.innerHTML = "";
          var cards = [];
          (data.stories || []).forEach(function (story, idx) {
            var card = document.createElement("article");
            card.className = "card";
            card.tabIndex = 0;
            card.setAttribute("role", "button");
            card.setAttribute(
              "aria-label",
              "Story " + (idx + 1) + " of " + (data.stories || []).length + ": " + story.headline
            );
            card.innerHTML =
              '<p class="date">' + escapeHtml(story.date) + "</p>" +
              "<h2>" + escapeHtml(story.headline) + "</h2>" +
              '<p class="sub">' + escapeHtml(story.subtitle) + "</p>";

            /* Selecting a story (tap/click, or stepping onto it with a key)
               brings the page to it instead of scrolling the whole page. */
            card.addEventListener("click", function () {
              focusCard(card);
            });
            card.addEventListener("focus", function () {
              card.scrollIntoView({
                behavior: reduceMotion ? "auto" : "smooth",
                block: "start"
              });
            });
            card.addEventListener("keydown", function (ev) {
              var pos = cards.indexOf(card);
              if (ev.key === "ArrowDown" || ev.key === "Down") {
                ev.preventDefault();
                if (pos < cards.length - 1) focusCard(cards[pos + 1]);
              } else if (ev.key === "ArrowUp" || ev.key === "Up") {
                ev.preventDefault();
                if (pos > 0) focusCard(cards[pos - 1]);
              } else if (ev.key === "Home") {
                ev.preventDefault();
                focusCard(cards[0]);
              } else if (ev.key === "End") {
                ev.preventDefault();
                focusCard(cards[cards.length - 1]);
              }
            });

            cards.push(card);
            feedEl.appendChild(card);
          });
        }

        function fetchJson(urls) {
          var chain = Promise.reject(new Error("no urls"));
          urls.forEach(function (u) {
            chain = chain.catch(function () {
              return fetch(u, { cache: "no-cache" }).then(function (res) {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
              });
            });
          });
          return chain;
        }

        function loadFeed(tab, urls, feedId) {
          var feedEl = document.getElementById(feedId);
          fetchJson(urls)
            .then(function (data) {
              renderFeed(feedEl, data);
              if (data.updated) {
                updatedByTab[tab] = data.updated;
                updateFooter(currentTab);
              }
            })
            .catch(function () {
              feedEl.innerHTML =
                '<div class="state-msg">Couldn\'t load the latest stories — check back soon.</div>';
            });
        }

        /* ---------- Pop Quiz (baked in; changes rarely) ---------- */
        var QUESTIONS = [
          {
            q: "A customer asks how long the battery lasts on the new Ray-Ban Meta Gen 3 glasses. What do you tell them?",
            options: ["About 4 hours", "Up to 9 hours", "A full 24 hours"],
            correct: 1,
            fact: "The charging case adds roughly 50 more hours — that's the \"all-day\" answer for the floor."
          },
          {
            q: "What's the key difference of the $349 Ray-Ban Meta Audio glasses?",
            options: ["They have a better camera", "They have no camera at all", "They only work with iPhones"],
            correct: 1,
            fact: "They're the answer for customers who want the look, music and calls without any camera."
          },
          {
            q: "A customer just bought Ray-Ban Meta glasses. Which app do they pair them with?",
            options: ["Meta View", "Facebook", "The Meta AI app"],
            correct: 2,
            fact: "Meta View was the old app name — if a customer mentions it, they're thinking of the right thing, just outdated."
          },
          {
            q: "A customer wants the cheapest way into VR. Which headset do you point them to?",
            options: ["Quest 3", "Quest 3S", "Quest Pro"],
            correct: 1,
            fact: "The 3S is the budget pick; the Quest 3 is the step-up with better displays and full-color mixed reality."
          },
          {
            q: "A customer worries the glasses could secretly record people. What do you tell them about the capture light?",
            options: [
              "It can be switched off in settings",
              "There isn't one",
              "It flashes on every photo and video and can't be turned off without disabling the camera"
            ],
            correct: 2,
            fact: "Meta even pushed a software update so the camera stops working if the LED is covered or tampered with."
          }
        ];

        var quizRoot = document.getElementById("quiz-root");
        var qIndex = 0;

        function renderQuestion() {
          var item = QUESTIONS[qIndex];
          quizRoot.innerHTML = "";

          var progress = document.createElement("p");
          progress.className = "quiz-progress";
          progress.textContent = "Question " + (qIndex + 1) + " of " + QUESTIONS.length;
          quizRoot.appendChild(progress);

          var q = document.createElement("p");
          q.className = "quiz-q";
          q.textContent = item.q;
          quizRoot.appendChild(q);

          var answers = document.createElement("div");
          answers.className = "answers";
          var letters = ["A", "B", "C"];

          item.options.forEach(function (opt, i) {
            var btn = document.createElement("button");
            btn.type = "button";
            var letter = document.createElement("span");
            letter.className = "letter";
            letter.textContent = letters[i];
            var text = document.createElement("span");
            text.textContent = opt;
            btn.appendChild(letter);
            btn.appendChild(text);
            btn.addEventListener("click", function () {
              if (i === item.correct) {
                renderCorrect();
              } else {
                btn.classList.add("wrong");
              }
            });
            answers.appendChild(btn);
          });

          quizRoot.appendChild(answers);
        }

        function renderCorrect() {
          var item = QUESTIONS[qIndex];
          var last = qIndex === QUESTIONS.length - 1;
          quizRoot.innerHTML = "";

          var screen = document.createElement("div");
          screen.className = "correct-screen";

          var burst = document.createElement("div");
          burst.className = "burst";
          burst.setAttribute("aria-hidden", "true");
          burst.textContent = "✦";
          screen.appendChild(burst);

          var h = document.createElement("h2");
          h.textContent = "Correct!";
          screen.appendChild(h);

          var fact = document.createElement("p");
          fact.className = "fact";
          fact.textContent = item.fact;
          screen.appendChild(fact);

          var next = document.createElement("button");
          next.type = "button";
          next.className = "big-btn";
          next.textContent = last ? "Finish" : "Next question";
          next.addEventListener("click", function () {
            if (last) {
              renderDone();
            } else {
              qIndex += 1;
              renderQuestion();
            }
            window.scrollTo(0, 0);
          });
          screen.appendChild(next);

          quizRoot.appendChild(screen);
        }

        function renderDone() {
          quizRoot.innerHTML = "";
          var screen = document.createElement("div");
          screen.className = "done-screen";

          var h = document.createElement("h2");
          h.textContent = "Scroll Complete";
          screen.appendChild(h);

          var p = document.createElement("p");
          p.textContent = "Five for five. You're ready for whoever walks in.";
          screen.appendChild(p);

          var again = document.createElement("button");
          again.type = "button";
          again.className = "big-btn";
          again.textContent = "Run it again";
          again.addEventListener("click", function () {
            qIndex = 0;
            renderQuestion();
            window.scrollTo(0, 0);
          });
          screen.appendChild(again);

          quizRoot.appendChild(screen);
        }

        renderQuestion();
      })();
    </script>
